<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen Parcial - Prestamos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .caja {
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 15px;
        }
        .equipo-item {
            border: 1px dashed #666;
            padding: 5px;
            margin: 5px 0;
            width: 200px;
        }
        .disp { color: green; font-weight: bold; }
        .prest { color: red; font-weight: bold; }
        #err { color: red; font-weight: bold; }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 6px;
        }
    </style>
</head>
<body>

    <h2>Registro de Préstamos de Equipos</h2>

    <!-- 1. Lista de Equipos -->
    <div class="caja">
        <h3>Equipos registrados</h3>
        <div id="divEquipos"></div>
    </div>

    <!-- 2. Formulario -->
    <div class="caja">
        <h3>Nuevo Préstamo</h3>
        <div id="err"></div>
        <form id="formPrestamo">
            <label>Nombre del solicitante:</label><br>
            <input type="text" id="txtNombre"><br><br>

            <label>Correo electrónico:</label><br>
            <input type="text" id="txtCorreo"><br><br>

            <label>Equipo:</label><br>
            <select id="selEquipo">
                <option value="">-- Seleccionar --</option>
            </select><br><br>

            <label>Cantidad de días:</label><br>
            <input type="number" id="txtDias"><br><br>

            <button type="button" onclick="guardarPrestamo()">Registrar Préstamo</button>
        </form>
    </div>

    <!-- 3. Listado inferior -->
    <div class="caja">
        <h3>Lista de Préstamos</h3>
        <table>
            <thead>
                <tr>
                    <th>Solicitante</th>
                    <th>Equipo</th>
                    <th>Días</th>
                </tr>
            </thead>
            <tbody id="tablaDatos">
            </tbody>
        </table>
    </div>

    <script>
        // 1. Equipos precargados en JavaScript
        var equipos = [
            { id: 1, nombre: "Proyector EPSON", estado: "Disponible" },
            { id: 2, nombre: "Laptop Dell XPS", estado: "Disponible" },
            { id: 3, nombre: "Cámara Canon EOS", estado: "Disponible" }
        ];

        var prestamos = [];

        // Dibuja los equipos y las opciones del selector
        function cargarEquipos() {
            var div = document.getElementById("divEquipos");
            var combo = document.getElementById("selEquipo");

            div.innerHTML = "";
            combo.innerHTML = '<option value="">-- Seleccionar --</option>';

            for (var i = 0; i < equipos.length; i++) {
                var eq = equipos[i];

                // Mostrar en la lista superior
                var claseCSS = "disp";
                if (eq.estado == "Prestado") {
                    claseCSS = "prest";
                }

                div.innerHTML += '<div class="equipo-item">' +
                    '<b>' + eq.nombre + '</b><br>' +
                    'Estado: <span class="' + claseCSS + '">' + eq.estado + '</span>' +
                '</div>';

                // Cargar en el desplegable
                combo.innerHTML += '<option value="' + eq.id + '">' + eq.nombre + ' (' + eq.estado + ')</option>';
            }
        }

        // Registrar Préstamo
        function guardarPrestamo() {
            var errDiv = document.getElementById("err");
            errDiv.innerText = "";

            var nom = document.getElementById("txtNombre").value;
            var mail = document.getElementById("txtCorreo").value;
            var eqId = document.getElementById("selEquipo").value;
            var d = document.getElementById("txtDias").value;

            // VALIDACIÓN 1: Todos los campos son obligatorios
            if (nom == "" || mail == "" || eqId == "" || d == "") {
                errDiv.innerText = "Debe completar todos los campos.";
                return;
            }

            // VALIDACIÓN 2: Correo electrónico válido
            if (mail.indexOf("@") == -1 || mail.indexOf(".") == -1) {
                errDiv.innerText = "Ingrese un correo electrónico válido.";
                return;
            }

            // VALIDACIÓN 3: Cantidad de días mayor a 0
            if (parseInt(d) <= 0) {
                errDiv.innerText = "La cantidad de días debe ser mayor que 0.";
                return;
            }

            // Buscar el equipo en el arreglo
            var seleccionado = null;
            for (var j = 0; j < equipos.length; j++) {
                if (equipos[j].id == eqId) {
                    seleccionado = equipos[j];
                    break;
                }
            }

            // VALIDACIÓN 4: Solo si está Disponible
            if (seleccionado.estado != "Disponible") {
                errDiv.innerText = "El equipo seleccionado no está disponible.";
                return;
            }

            // REGISTRO DEL PRÉSTAMO Y CAMBIO DE ESTADO
            seleccionado.estado = "Prestado"; // Cambia estado

            // Agregar al listado
            prestamos.push({
                nombre: nom,
                equipo: seleccionado.nombre,
                dias: d
            });

            // Actualizar interfaz
            cargarEquipos();
            actualizarTabla();

            // Limpiar formulario
            document.getElementById("formPrestamo").reset();
        }

        // Renderizar la tabla de préstamos
        function actualizarTabla() {
            var tbody = document.getElementById("tablaDatos");
            tbody.innerHTML = "";

            for (var k = 0; k < prestamos.length; k++) {
                var p = prestamos[k];
                tbody.innerHTML += '<tr>' +
                    '<td>' + p.nombre + '</td>' +
                    '<td>' + p.equipo + '</td>' +
                    '<td>' + p.dias + '</td>' +
                '</tr>';
            }
        }

        // Carga inicial
        cargarEquipos();
    </script>
</body>
</html>
